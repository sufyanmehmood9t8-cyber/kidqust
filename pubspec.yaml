name: little_scholars
description: "Little Scholars - Bilingual Education App for Pakistan Class 1-6"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  audioplayers: ^5.2.1
  flutter_tts: ^4.2.2
  path_provider: ^2.1.4
  youtube_player_iframe: ^5.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/mascot.png
    - assets/images/pic.jpeg
    - assets/images/book.png
    - assets/images/book_clean.png
    - assets/audio/
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/novalogo.png"

  web:
    generate: true
    image_path: "assets/icon/novalogo.png"
    background_color: "#FFFFFF"
    theme_color: "#2196F3"

  windows:
    generate: true
    image_path: "assets/icon/novalogo.png"
    icon_size: 48